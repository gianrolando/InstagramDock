name: macOS build and detector tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test and package universal app
        run: bash scripts/package.sh universal
      - uses: actions/upload-artifact@v4
        with:
          name: InstagramDock-macOS-universal
          path: dist/*
